<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚢 애진화방 상회경기 </title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #fdfbfb;
            --primary-pastel: #ffb7b2;
            --secondary-pastel: #e2f0cb;
            --accent-pink: #ff9aa2;
            --soft-purple: #e1ce7a;
            --pastel-blue: #c7ceea;
            --text-dark: #4a4a4a;
            --text-muted: #888888;
            --card-bg: #ffffff;
            --border-radius: 20px;
            --shadow: 0 10px 25px rgba(255, 183, 178, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--text-dark);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Search Section */
        .search-box {
            background: var(--card-bg);
            padding: 18px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .search-row {
            display: flex;
            gap: 12px;
        }

        .search-input-wrapper {
            position: relative;
            flex: 1;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-pink);
        }

        .search-input {
            width: 100%;
            padding: 12px 14px 12px 44px;
            border: 2px solid #ffdac1;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            background-color: #fff9f9;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-pink);
            background-color: #ffffff;
        }

        /* Day Navigation Tabs */
        .day-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            flex: 1;
            min-width: 90px;
            padding: 12px 8px;
            background-color: var(--card-bg);
            border: 2px solid #f2e3e3;
            border-radius: 14px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .tab-btn:hover {
            border-color: var(--primary-pastel);
            color: var(--accent-pink);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ffb7b2 0%, #ff9aa2 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(255, 154, 162, 0.3);
        }

        /* Solution Display Box */
        .common-solution-card {
            background: linear-gradient(135deg, #fff5f5 0%, #f0f4ff 100%);
            border: 2px solid #ffe3e3;
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .common-solution-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #e57373;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .common-solution-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-dark);
        }

        .common-solution-key {
            margin-top: 10px;
            font-weight: 700;
            color: #d81b60;
            font-size: 0.95rem;
        }

        /* Results Display */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .day-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 18px 22px;
            border-left: 6px solid var(--primary-pastel);
        }

        .day-card.highlight {
            border-left-color: var(--pastel-blue);
        }

        .day-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #f2e3e3;
        }

        .nickname-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .flower-list-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .flower-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .flower-chip {
            background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%);
            border: 1.5px solid #ffb7b2;
            color: #d81b60;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(255, 183, 178, 0.2);
            transition: all 0.2s;
        }

        .flower-chip:hover {
            transform: scale(1.05);
            background: #ffb7b2;
            color: white;
        }

        .flower-chip .score-tag {
            font-size: 0.75rem;
            background-color: rgba(216, 27, 96, 0.1);
            padding: 2px 6px;
            border-radius: 10px;
        }

        .flower-chip:hover .score-tag {
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .empty-state i {
            font-size: 2.5rem;
            color: var(--primary-pastel);
            margin-bottom: 12px;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #ff9aa2 0%, #ffb7b2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(255, 154, 162, 0.4);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .day-tabs { flex-wrap: nowrap; }
            .tab-btn { min-width: 75px; padding: 10px 4px; font-size: 0.85rem; }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 기존 제목 박스 삭제됨 -->

    <!-- Search Section (Filter Input) -->
    <div class="search-box">
        <div class="search-row">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" class="search-input" placeholder="닉네임 또는 꽃 이름으로 필터링" onkeyup="renderData()">
            </div>
        </div>
    </div>

    <!-- Day Filter Tabs -->
    <div class="day-tabs">
        <button class="tab-btn active" onclick="selectTab('1', this)">🌱 1일차</button>
        <button class="tab-btn" onclick="selectTab('2', this)">🌱 2일차</button>
        <button class="tab-btn" onclick="selectTab('3', this)">🌱 3일차</button>
        <button class="tab-btn" onclick="selectTab('4', this)">🌼 4일차</button>
        <button class="tab-btn" onclick="selectTab('5', this)">🌼 5일차</button>
    </div>

    <!-- Common Solution Display Box -->
    <div id="common-solution" class="common-solution-card">
        <!-- JS로 동적 삽입 -->
    </div>

    <!-- Main Results Display -->
    <div id="results" class="results-container">
        <div class="empty-state">
            <i class="fa-solid fa-seedling"></i>
            <p>데이터를 불러오는 중입니다...</p>
        </div>
    </div>

</div>

<!-- Toast Notification -->
<div id="toast" class="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toast-msg">복사되었습니다!</span>
</div>

<script>
    // Google Apps Script Web App Endpoint URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx0z61tZ4eWhTT5LPlJfnT1c1UqtTb9B4TACYm1tKdDG01fvZvIAAfhIBNJpsE_E8Vvkg/exec";

    // Day Solutions Data
    const SOLUTIONS = {
        1: {
            title: "🌱 1일차",
            text: "1일차는 아직 시간이 여유로운 편이라 지정된 높은 꽃 위주로 천천히 진행해주시면 됩니다.\n굳이 서두르실 필요 없이 높은 꽃이 나왔을 때 진행해주시고, 다른 꽃은 크게 신경 쓰지 않으셔도 괜찮습니다.",
            key: "→ 1일차는 지정된 높은 꽃만 여유롭게 진행!"
        },
        2: {
            title: "🌱 2일차",
            text: "2일차 역시 시간적인 여유가 있기 때문에 지정된 높은 꽃을 우선적으로 진행해주세요.\n조금 기다리더라도 높은 꽃을 잡아가는 방향으로 진행하면 되고, 보조꽃까지 무리해서 챙길 필요는 없습니다.",
            key: "→ 2일차도 높은 꽃 위주로 천천히 진행!"
        },
        3: {
            title: "🌱 3일차",
            text: "3일차까지는 크게 급하게 진행하지 않아도 됩니다.\n지정된 높은 꽃이 나올 때까지 기다렸다가 진행해주시고, 아직은 보조꽃보다는 높은 꽃에 집중해주시면 됩니다.",
            key: "→ 3일차까지는 높은 꽃 위주로 여유롭게!"
        },
        4: {
            title: "🌼 4일차",
            text: "4일차부터는 조금씩 속도를 올려주시면 좋습니다.\n높은 꽃을 기본으로 진행하되, 높은 꽃을 기다리는 시간이 길어지면 보조꽃도 함께 진행해주세요.\n높은 꽃만 계속 기다리기보다는 상황에 따라 보조꽃을 섞어주시면 훨씬 안정적으로 진행할 수 있습니다.",
            key: "→ 4일차부터는 높은 꽃 + 보조꽃 병행 가능!"
        },
        5: {
            title: "🌼 5일차",
            text: "5일차는 마무리 단계인 만큼 조금 더 적극적으로 진행해주시면 됩니다.\n높은 꽃이 가장 우선이지만, 너무 오래 기다리기보다는 추천드린 보조꽃도 같이 진행해주세요.\n특히 남은 시간이 부족해질 경우에는 보조꽃을 적극적으로 활용해서 최대한 안정적으로 마무리하는 방향으로 진행하면 됩니다.",
            key: "→ 5일차는 높은 꽃 우선 + 보조꽃 적극 활용!"
        }
    };

    let flowerData = [];
    let nicknames = [];
    let activeTab = '1';

    window.onload = function() {
        fetchDataFromGAS();
    };

    // Fetch JSON from Google Apps Script
    function fetchDataFromGAS() {
        fetch(GAS_URL)
            .then(res => res.json())
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    processData(data);
                } else if (data.error) {
                    alert("오류: " + data.error);
                }
            })
            .catch(err => {
                console.error("GAS 데이터 로드 실패:", err);
            });
    }

    // Process Received JSON Data
    function processData(data) {
        flowerData = data.map(item => ({
            name: (item.flowerName || item.name || '').toString().trim(),
            score: parseFloat(item.score) || 0,
            owners: item.owners || {}
        })).filter(d => d.name !== '');

        const nickSet = new Set();
        flowerData.forEach(item => {
            Object.keys(item.owners).forEach(nick => nickSet.add(nick));
        });
        nicknames = Array.from(nickSet);

        renderData();
    }

    // Calculation Logic for Each Nickname
    function getNicknameFlowerStrategy(nick) {
        const owned = flowerData.filter(d => d.owners[nick] && d.score >= 14);
        if (owned.length === 0) return { days13: [], days45: [] };

        const scoreGroups = {};
        owned.forEach(item => {
            if (!scoreGroups[item.score]) scoreGroups[item.score] = [];
            scoreGroups[item.score].push(item);
        });

        const sortedScores = Object.keys(scoreGroups).map(Number).sort((a, b) => b - a);

        let days13 = [];
        let days45 = [];

        if (sortedScores.length > 0) {
            const topScore = sortedScores[0];
            const topFlowers = scoreGroups[topScore];

            if (topScore === 23 && (topFlowers.length === 1 || topFlowers.length === 2) && scoreGroups[21]) {
                days13 = [...topFlowers, ...scoreGroups[21]];
            } else {
                days13 = topFlowers;
            }

            days45 = sortedScores.length > 1 ? scoreGroups[sortedScores[1]] : [];
        }

        return { days13, days45 };
    }

    // Render Data
    function renderData() {
        const day = parseInt(activeTab);
        const sol = SOLUTIONS[day];

        const commonSolDiv = document.getElementById('common-solution');

        commonSolDiv.innerHTML = `
            <div class="common-solution-title">
                <i class="fa-solid fa-lightbulb" style="color:#ff80ab;"></i>
                ${sol.title}
            </div>
            <div class="common-solution-body">
                ${sol.text.replace(/\n/g, '<br>')}
            </div>
            <div class="common-solution-key">
                ${sol.key}
            </div>
        `;

        const rawQuery = document.getElementById('search-input').value.trim();
        const cleanQuery = rawQuery.replace(/\s+/g, '').toLowerCase();

        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        const isHighDay = day <= 3;
        let renderedCount = 0;

        const isExactNickSearch = nicknames.some(
            nick => nick.replace(/\s+/g, '').toLowerCase() === cleanQuery
        );

        nicknames.forEach(nick => {
            const { days13, days45 } = getNicknameFlowerStrategy(nick);
            const targetFlowers = isHighDay ? days13 : days45;
            const subFlowers = isHighDay ? [] : days13;

            let isMatch = false;

            if (!cleanQuery) {
                isMatch = true;
            } else if (isExactNickSearch) {
                const cleanNick = nick.replace(/\s+/g, '').toLowerCase();
                isMatch = (cleanNick === cleanQuery);
            } else {
                if (cleanQuery.length >= 2) {
                    const allDisplayFlowers = [...targetFlowers, ...subFlowers];

                    isMatch = allDisplayFlowers.some(f => {
                        const cleanFlowerName = f.name.replace(/\s+/g, '').toLowerCase();
                        return cleanFlowerName.includes(cleanQuery);
                    });
                } else {
                    isMatch = false;
                }
            }

            if (!isMatch) {
                return;
            }

            renderedCount++;

            const card = document.createElement('div');
            card.className = `day-card ${day >= 4 ? 'highlight' : ''}`;

            let flowerHtml = '';

            if (isHighDay) {
                flowerHtml = `
                    <div class="flower-list-title">
                        <i class="fa-solid fa-crown" style="color:#ffb7b2;"></i>
                        지정꽃:
                    </div>

                    <div class="flower-chips">
                        ${targetFlowers.length > 0
                            ? targetFlowers.map(f => `
                                <button class="flower-chip" onclick="copyFlowerName('${f.name}')">
                                    🌸 ${f.name}
                                    <span class="score-tag">${f.score}점</span>
                                </button>
                            `).join('')
                            : '<span style="color:var(--text-muted); font-size:0.85rem;">지정된 꽃이 없습니다.</span>'
                        }
                    </div>
                `;
            } else {
                flowerHtml = `
                    <div class="flower-list-title">
                        <i class="fa-solid fa-star" style="color:#ffb7b2;"></i>
                        우선 보유 꽃 (최고 점수):
                    </div>

                    <div class="flower-chips" style="margin-bottom:10px;">
                        ${subFlowers.length > 0
                            ? subFlowers.map(f => `
                                <button class="flower-chip" onclick="copyFlowerName('${f.name}')">
                                    👑 ${f.name}
                                    <span class="score-tag">${f.score}점</span>
                                </button>
                            `).join('')
                            : '<span style="color:var(--text-muted); font-size:0.85rem;">없음</span>'
                        }
                    </div>

                    <div class="flower-list-title">
                        <i class="fa-solid fa-seedling" style="color:#7cb342;"></i>
                        추천 보조 꽃 (2순위 점수):
                    </div>

                    <div class="flower-chips">
                        ${targetFlowers.length > 0
                            ? targetFlowers.map(f => `
                                <button class="flower-chip" onclick="copyFlowerName('${f.name}')">
                                    🌼 ${f.name}
                                    <span class="score-tag">${f.score}점</span>
                                </button>
                            `).join('')
                            : '<span style="color:var(--text-muted); font-size:0.85rem;">추천 보조 꽃이 없습니다.</span>'
                        }
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="day-card-header">
                    <div class="nickname-title">${nick}</div>
                </div>
                ${flowerHtml}
            `;

            resultsDiv.appendChild(card);
        });

        if (renderedCount === 0) {
            resultsDiv.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <p>'${rawQuery}'에 해당하는 결과가 없습니다.</p>
                </div>
            `;
        }
    }

    // Filter Tab Click
    function selectTab(tab, btn) {
        activeTab = tab;

        document.querySelectorAll('.tab-btn').forEach(
            b => b.classList.remove('active')
        );

        btn.classList.add('active');

        renderData();
    }

    // Copy Flower Name + Heart Emoji
    function copyFlowerName(flowerName) {
        const copyText = `${flowerName} ❤️`;

        navigator.clipboard.writeText(copyText).then(() => {
            showToast(`'${copyText}' 복사되었습니다!`);
        }).catch(err => {
            console.error("복사 실패:", err);
        });
    }

    // Toast Notification Display
    function showToast(msg) {
        const toast = document.getElementById('toast');

        document.getElementById('toast-msg').innerText = msg;

        toast.classList.add('show');

        setTimeout(() => {
            toast.classList.remove('show');
        }, 2200);
    }
</script>

</body>
</html>
